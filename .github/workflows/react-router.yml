name: React Router compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: React Router framework production
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: TanStack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:react-router
      - run: node scripts/test-react-router.mjs --development
