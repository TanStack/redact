name: Vinext compatibility

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-vinext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vinext compatibility (${{ matrix.vinext }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vinext: ['1.3.0', '1.4.3', '1.4.4']
    container:
      # Keep the browser binaries and system libraries matched to Playwright.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size=1gb
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VINEXT_TEST_CONCURRENCY: '2'
      VINEXT_TEST_VERSION: ${{ matrix.vinext }}
    steps:
      - name: Match container home ownership
        # Firefox requires the home directory to belong to its effective user.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Set test paths
        run: |
          echo "VINEXT_TEST_RESULTS=$RUNNER_TEMP/vinext-results" >> "$GITHUB_ENV"
          echo "VINEXT_TEST_CONSUMER=$RUNNER_TEMP/vinext-consumer" >> "$GITHUB_ENV"
          echo "VINEXT_TEST_PAGES_RESULTS=$RUNNER_TEMP/vinext-pages-results" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0
      - name: Setup Node for Cloudflare tooling
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check runtime, types, package and unchanged size limits
        run: pnpm test:ci
      - name: Install browsers
        run: pnpm exec playwright install chromium firefox webkit
      - name: Verify both routers against native React from an unpatched npm install
        run: node scripts/test-vinext-consumer.mjs
      - name: Verify hosted state and cache contracts locally
        if: ${{ !cancelled() }}
        run: node scripts/test-vinext-hosted-state.mjs
      - name: Save compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vinext-compatibility-${{ matrix.vinext }}
          path: |
            ${{ env.VINEXT_TEST_RESULTS }}
            ${{ env.VINEXT_TEST_PAGES_RESULTS }}
          if-no-files-found: error
